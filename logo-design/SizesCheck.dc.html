<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: {{accent}}; }
    a:hover { opacity: 0.8; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor-blink { animation: blink 1.1s step-start infinite; }
  </style>
</helmet>
<div style="width:100%;height:100%;background:#0a0a0b;display:flex;flex-direction:column;justify-content:center;gap:36px;font-family:'JetBrains Mono', ui-monospace, Consolas, monospace;box-sizing:border-box;padding:32px;">

  <div style="display:flex;align-items:flex-end;gap:44px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:16px;height:16px;border:1px solid #232326;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:9px;font-weight:700;color:{{accent}};line-height:1;">&gt;_</span>
      </div>
      <span style="font-size:11px;color:#8a8a92;">16px favicon</span>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border:1px solid #232326;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:18px;font-weight:700;color:{{accent}};line-height:1;">&gt;_</span>
      </div>
      <span style="font-size:11px;color:#8a8a92;">32px favicon</span>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:48px;height:48px;border:1px solid #232326;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:26px;font-weight:700;color:{{accent}};line-height:1;">&gt;<span class="cursor-blink">_</span></span>
      </div>
      <span style="font-size:11px;color:#8a8a92;">48px app icon</span>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:64px;height:64px;border:1px solid #232326;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:18px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;">
          <span style="color:{{accent}};">&gt;</span><span style="color:#f2f2f3;margin-left:4px;">sb</span><span class="cursor-blink" style="display:inline-block;width:4px;height:14px;background:{{accent}};margin-left:4px;"></span>
        </span>
      </div>
      <span style="font-size:11px;color:#8a8a92;">64px compact</span>
    </div>

  </div>

  <div style="display:flex;align-items:center;background:#111113;border-bottom:1px solid #232326;height:64px;padding:0 24px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:26px;font-weight:600;color:{{accent}};line-height:1;">&gt;</span>
      <div style="font-size:20px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;">
        <span style="color:#f2f2f3;">secbyte</span><span style="color:#8a8a92;">.dev</span>
        <span class="cursor-blink" style="display:inline-block;width:8px;height:16px;background:{{accent}};margin-left:7px;"></span>
      </div>
    </div>
  </div>
  <span style="font-size:11px;color:#8a8a92;margin-top:-24px;">header scale, in a nav bar</span>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#5FD68D","options":["#5FD68D","#F2B872","#5FB8D6","#8A8A92"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FD68D' };
  }
}
</script>
</body>
</html>
