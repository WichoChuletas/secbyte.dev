<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: {{accent}}; }
    a:hover { opacity: 0.8; }
  </style>
</helmet>
<div style="width:100%;height:100%;background:#0a0a0b;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono', ui-monospace, Consolas, monospace;box-sizing:border-box;">
  <div style="display:flex;align-items:center;gap:16px;">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="8" y1="30" x2="20" y2="10" stroke="#8a8a92" stroke-width="2"></line>
      <line x1="20" y1="10" x2="32" y2="30" stroke="#8a8a92" stroke-width="2"></line>
      <circle cx="8" cy="30" r="4" fill="#0a0a0b" stroke="#f2f2f3" stroke-width="2"></circle>
      <circle cx="32" cy="30" r="4" fill="#0a0a0b" stroke="#f2f2f3" stroke-width="2"></circle>
      <circle cx="20" cy="10" r="5" fill="{{accent}}"></circle>
    </svg>
    <div style="font-size:32px;font-weight:600;letter-spacing:-0.02em;">
      <span style="color:#f2f2f3;">secbyte</span><span style="color:#8a8a92;">.dev</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#5FD68D","options":["#5FD68D","#F2B872","#5FB8D6","#8A8A92"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FD68D' };
  }
}
</script>
</body>
</html>
