<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: {{accent}}; }
    a:hover { opacity: 0.8; }
  </style>
</helmet>
<div style="width:100%;height:100%;background:#0a0a0b;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono', ui-monospace, Consolas, monospace;box-sizing:border-box;">
  <div style="font-size:34px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:baseline;">
    <span style="color:{{accent}};">&lt;</span><span style="color:#f2f2f3;">secbyte</span><span style="color:#8a8a92;">.dev</span><span style="color:#8a8a92;">&nbsp;/</span><span style="color:{{accent}};">&gt;</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#5FD68D","options":["#5FD68D","#F2B872","#5FB8D6","#8A8A92"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FD68D' };
  }
}
</script>
</body>
</html>
